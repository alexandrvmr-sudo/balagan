<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120c1f">
<title>Балаган</title>
<link rel="stylesheet" href="/app.css">
<style>
  html, body { overflow: auto; -webkit-text-size-adjust: 100%; }
  .stage { min-height: 100dvh; display: flex; flex-direction: column; gap: 16px;
           padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: 0 0 auto; }
  .brand { font-family: var(--display); font-weight: 900; font-size: 17px; letter-spacing: .06em; }
  .brand span { color: var(--rose); }
  .me { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
  .me .em { font-size: 22px; }
  .score { font-family: var(--display); font-size: 15px; color: var(--gold); }

  .main { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  h1 { font-size: 30px; line-height: 1.1; }
  .sub { color: var(--dim); font-size: 15px; line-height: 1.5; }

  input, textarea {
    width: 100%; font-family: inherit; font-size: 18px; color: var(--ink);
    background: rgba(255,255,255,.07); border: 2px solid var(--line); border-radius: 14px;
    padding: 16px; outline: none; -webkit-appearance: none;
  }
  input:focus, textarea:focus { border-color: var(--gold); background: rgba(255,255,255,.1); }
  textarea { min-height: 112px; resize: none; line-height: 1.35; }
  .codein { font-family: var(--display); font-size: 34px; text-align: center; letter-spacing: .3em; text-transform: uppercase; padding: 18px 16px 18px 26px; }

  .btn {
    display: block; width: 100%; padding: 18px; border-radius: 16px; font-size: 18px; font-weight: 800;
    background: linear-gradient(135deg, var(--rose), #ff6b3d); color: #fff; box-shadow: var(--shadow);
    transition: transform .12s, filter .12s;
  }
  .btn:active { transform: scale(.98); filter: brightness(1.1); }
  .btn[disabled] { opacity: .4; box-shadow: none; }
  .btn.ghost { background: rgba(255,255,255,.08); border: 2px solid var(--line); color: var(--ink); box-shadow: none; }
  .btn.gold { background: linear-gradient(135deg, var(--gold), #ff9f1c); color: #2a1a00; }

  .prompt { font-family: var(--display); font-size: 23px; line-height: 1.22; }
  .tag { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .opt { display: block; width: 100%; text-align: left; padding: 20px 18px; border-radius: 18px; font-size: 19px; font-weight: 700;
         line-height: 1.3; background: var(--card); border: 3px solid var(--line); margin-bottom: 14px; transition: transform .12s; }
  .opt:active { transform: scale(.985); }
  .opt.a { border-color: rgba(255,46,99,.55); }
  .opt.b { border-color: rgba(90,125,255,.55); }
  .opt.picked { border-color: var(--gold); background: rgba(255,210,63,.16); }
  .opt .no { font-size: 12px; letter-spacing: .14em; color: var(--dim); display: block; margin-bottom: 6px; }

  .wait { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .wait .em { font-size: 54px; animation: pulse 2s infinite; }
  .seats { display: flex; flex-wrap: wrap; gap: 8px; }
  .seat { padding: 8px 12px; border-radius: 40px; background: var(--card); border: 1px solid var(--line); font-size: 14px; font-weight: 700; }
  .seat.off { opacity: .4; }
  .err { color: var(--rose); font-size: 14px; font-weight: 700; min-height: 18px; }
  .timer { height: 6px; border-radius: 6px; background: rgba(255,255,255,.1); overflow: hidden; }
  .timer > div { height: 100%; background: linear-gradient(90deg, var(--mint), var(--gold)); }
  .foot { flex: 0 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .link { color: var(--gold); font-size: 14px; text-decoration: underline; }
  .off-note { position: fixed; left: 0; right: 0; top: 0; background: var(--rose); color: #fff; text-align: center;
              font-size: 13px; font-weight: 800; padding: 6px; z-index: 9; display: none; }
</style>
</head>
<body>
<div class="off-note" id="offnote">связь потеряна — возвращаемся…</div>
<div class="stage">
  <div class="head">
    <div class="brand">БАЛА<span>ГАН</span></div>
    <div class="me" id="me"></div>
  </div>
  <div class="main" id="app"></div>
  <div class="foot" id="foot"></div>
</div>

<script type="module">
const app = document.getElementById('app');
const foot = document.getElementById('foot');
const meBox = document.getElementById('me');
const offnote = document.getElementById('offnote');

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const urlCode = (location.pathname.match(/^\/j\/([A-Za-z]{4})/) || [])[1]?.toUpperCase() || '';

let S = null, me = null, ws = null, retry = 0, key = '', err = '';
// ?new=1 — хранить всё только в этой вкладке: так можно открыть несколько игроков на одном устройстве
const box = new URLSearchParams(location.search).has('new') ? sessionStorage : localStorage;
const store = {
  get code() { return urlCode || box.getItem('balagan.code') || ''; },
  get token() { return box.getItem(`balagan.token.${this.code}`) || ''; },
  save(code, token) { box.setItem('balagan.code', code); if (token) box.setItem(`balagan.token.${code}`, token); },
};

/* ---------- связь ---------- */
function connect(code, name) {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.onopen = () => {
    retry = 0; offnote.style.display = 'none';
    ws.send(JSON.stringify({ t: 'join', code, name, token: store.token || undefined }));
  };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === 'welcome') { me = m; store.save(m.code, m.token); err = ''; return; }
    if (m.t === 'error') { err = m.msg; me = null; ws.close(); key = ''; return drawEntry(); }
    if (m.t === 'state') { S = m; render(); }
  };
  ws.onclose = () => {
    if (!me) return;
    offnote.style.display = '';
    retry++;
    setTimeout(() => connect(store.code, me?.name), Math.min(400 * retry, 4000));
  };
}

const act = (payload) => { try { ws.send(JSON.stringify({ t: 'act', ...payload })); } catch {} };

/* ---------- экран входа ---------- */
function drawEntry() {
  meBox.innerHTML = '';
  app.innerHTML = `
    <h1>Заходи в игру</h1>
    <div class="sub">Код комнаты написан на большом экране.</div>
    ${urlCode ? '' : '<input class="codein" id="code" maxlength="4" autocapitalize="characters" autocomplete="off" inputmode="latin" placeholder="КОД">'}
    <input id="name" maxlength="14" placeholder="Как тебя звать?" autocomplete="off">
    <div class="err">${esc(err)}</div>`;
  foot.innerHTML = `<button class="btn" id="go">Поехали</button>`;
  const nameEl = document.getElementById('name');
  const codeEl = document.getElementById('code');
  nameEl.value = box.getItem('balagan.name') || '';
  document.getElementById('go').onclick = () => {
    const code = (urlCode || codeEl?.value || '').toUpperCase().trim();
    const name = nameEl.value.trim();
    if (code.length !== 4) { err = 'Код — четыре буквы'; return drawEntry(); }
    if (!name) { err = 'Впиши имя'; return drawEntry(); }
    box.setItem('balagan.name', name);
    err = ''; app.innerHTML = '<div class="wait"><div class="em">🎪</div><div class="sub">заходим…</div></div>'; foot.innerHTML = '';
    connect(code, name);
  };
  nameEl.onkeydown = (e) => { if (e.key === 'Enter') document.getElementById('go').click(); };
}

/* ---------- основной рендер ---------- */
function render() {
  const s = S;
  meBox.innerHTML = s.you
    ? `<span class="em">${s.you.emoji}</span><span style="color:${s.you.color}">${esc(s.you.name)}</span>
       ${s.you.isHost ? '<span style="color:var(--gold)">★</span>' : ''}
       <span class="score">${s.you.score}</span>`
    : '';

  const k = [s.phase, s.round, s.vote?.prompt, s.task?.prompt, s.waiting, s.canStart, s.players.length].join('|');
  if (k === key) return liveOnly();
  key = k;

  if (s.phase === 'lobby') return drawLobby();
  if (s.phase === 'writing' && s.task) return drawTask();
  if (s.phase === 'voting' && s.vote) return drawVote();
  if (s.phase === 'winner') return drawWinner();
  drawWait();
}

function liveOnly() {
  if (!S.vote) return;
  for (const o of S.vote.options) {
    const el = app.querySelector(`[data-o="${o.id}"]`);
    if (el) el.classList.toggle('picked', S.votedFor === o.id);
  }
}

function drawLobby() {
  const s = S;
  const seats = s.players.map((p) => `<div class="seat ${p.connected ? '' : 'off'}">${p.emoji} ${esc(p.name)}${p.isHost ? ' ★' : ''}</div>`).join('');
  app.innerHTML = `
    <div class="tag">комната ${s.code}</div>
    <h1>${s.you?.audience ? 'Ты в зале' : 'Ждём всех'}</h1>
    <div class="sub">${s.you?.audience
      ? 'Писать шутки уже не выйдет — зато твой голос считается наравне со всеми.'
      : s.need ? `Нужно ещё ${s.need} ${s.need === 1 ? 'игрок' : 'игрока'}.` : 'Можно начинать.'}</div>
    <div class="seats">${seats}</div>
    ${s.you?.isHost && s.aiEnabled ? `
      <div>
        <div class="tag" style="margin-bottom:8px">тема вечера — по ней придумаются задания</div>
        <input id="topic" maxlength="120" placeholder="например: днюха Макса, все с работы" value="${esc(s.topic || '')}">
      </div>` : ''}`;
  foot.innerHTML = s.you?.isHost
    ? `<button class="btn ${s.canStart ? '' : ''}" id="start" ${s.canStart ? '' : 'disabled'}>Начать игру</button>
       <div class="sub" style="text-align:center">${s.aiEnabled ? 'задания придумает ИИ' : 'играем на встроенном паке'}</div>`
    : `<div class="sub" style="text-align:center">★ ждёт, пока все соберутся</div>`;

  const topic = document.getElementById('topic');
  if (topic) {
    let t;
    topic.oninput = () => { clearTimeout(t); t = setTimeout(() => act({ a: 'topic', topic: topic.value }), 400); };
  }
  const start = document.getElementById('start');
  if (start) start.onclick = () => { start.disabled = true; start.textContent = 'Поехали!'; act({ a: 'start' }); };
}

function drawTask() {
  const s = S;
  app.innerHTML = `
    <div class="tag">${s.task.final ? 'финальная затравка' : `затравка ${s.task.no} из ${s.task.of}`} · ${s.roundValue} очков</div>
    <div class="prompt">${esc(s.task.prompt)}</div>
    <textarea id="ans" maxlength="90" placeholder="впиши самое смешное…" autocomplete="off" autocapitalize="sentences"></textarea>
    <div class="timer"><div id="tf"></div></div>`;
  foot.innerHTML = `<button class="btn" id="send">Готово</button>`;
  const ta = document.getElementById('ans');
  setTimeout(() => ta.focus(), 120);
  const send = () => {
    const text = ta.value.trim();
    if (!text) return;
    act({ a: 'answer', text });
    foot.innerHTML = '';
    app.innerHTML = '<div class="wait"><div class="em">✍️</div><div class="sub">принято</div></div>';
  };
  document.getElementById('send').onclick = send;
  ta.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
}

function drawVote() {
  const s = S;
  const duel = s.vote.options.length === 2;
  const opts = s.vote.options.map((o, i) => `
    <button class="opt ${i % 2 ? 'b' : 'a'} ${s.votedFor === o.id ? 'picked' : ''}" data-o="${o.id}">
      ${duel ? `<span class="no">вариант ${i === 0 ? 'первый' : 'второй'}</span>` : ''}${esc(o.text)}
    </button>`).join('');
  app.innerHTML = `
    <div class="tag">${s.vote.final ? 'финал · выбери самый смешной' : 'что смешнее?'}</div>
    <div class="prompt" style="font-size:19px">${esc(s.vote.prompt)}</div>
    <div>${opts}</div>
    <div class="timer"><div id="tf"></div></div>`;
  foot.innerHTML = s.votedFor ? '<div class="sub" style="text-align:center">голос принят</div>' : '';
  app.querySelectorAll('.opt').forEach((b) => {
    b.onclick = () => {
      if (S.votedFor) return;
      act({ a: 'vote', for: b.dataset.o });
      app.querySelectorAll('.opt').forEach((x) => x.classList.remove('picked'));
      b.classList.add('picked');
      foot.innerHTML = '<div class="sub" style="text-align:center">голос принят</div>';
    };
  });
}

function drawWait() {
  const s = S;
  const em = s.phase === 'cooking' ? '🧠' : s.phase === 'voting' ? '👀' : s.phase === 'scores' ? '📊' : '🎪';
  app.innerHTML = `
    <div class="wait">
      <div class="em">${em}</div>
      <div class="prompt" style="font-size:20px">${esc(s.waiting || 'Смотри на большой экран')}</div>
      ${s.you && !s.you.audience ? `<div class="sub">у тебя ${s.you.score} очков</div>` : ''}
    </div>`;
  foot.innerHTML = '';
}

function drawWinner() {
  const s = S;
  const win = s.winner;
  const mine = win && s.you && win.id === s.you.id;
  app.innerHTML = `
    <div class="wait">
      <div class="em">${mine ? '🏆' : '🎉'}</div>
      <h1 style="text-align:center">${mine ? 'Это ты!' : esc(win?.name || '—')}</h1>
      <div class="sub">${mine ? 'самый смешной человек вечера' : `победитель с ${win?.score ?? 0} очками`}</div>
      ${s.you && !s.you.audience ? `<div class="score" style="font-size:20px">у тебя ${s.you.score}</div>` : ''}
    </div>`;
  foot.innerHTML = s.canRestart ? `<button class="btn gold" id="again">Ещё раз</button>` : '';
  const again = document.getElementById('again');
  if (again) again.onclick = () => { again.disabled = true; act({ a: 'again' }); };
}

/* таймер-полоска */
function tick() {
  const tf = document.getElementById('tf');
  if (tf && S?.deadline) {
    const total = S.phase === 'writing' ? 80000 : 20000;
    tf.style.width = `${Math.max(0, Math.min(100, ((S.deadline - Date.now()) / total) * 100))}%`;
  }
  requestAnimationFrame(tick);
}
tick();

/* старт: если уже есть токен для этой комнаты — входим молча */
if (store.code && store.token) {
  me = { name: box.getItem('balagan.name') || '' };
  app.innerHTML = '<div class="wait"><div class="em">🎪</div><div class="sub">возвращаемся в игру…</div></div>';
  connect(store.code, me.name);
  setTimeout(() => { if (!S) { me = null; drawEntry(); } }, 3000);
} else {
  drawEntry();
}
</script>
</body>
</html>
