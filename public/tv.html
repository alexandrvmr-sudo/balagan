<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Балаган · экран</title>
<link rel="stylesheet" href="/app.css">
<style>
  .stage { height: 100vh; display: flex; flex-direction: column; padding: 3.4vmin 4vmin; gap: 2.6vmin; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 2vmin; flex: 0 0 auto; }
  .brand { font-family: var(--display); font-weight: 900; font-size: 2.6vmin; letter-spacing: 0.06em; }
  .brand span { color: var(--rose); }
  .roundtag { font-size: 1.7vmin; }
  .body { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }

  /* таймер */
  .timer { flex: 0 0 auto; height: 1.1vmin; border-radius: 1vmin; background: rgba(255,255,255,.1); overflow: hidden; }
  .timer-fill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--mint), var(--gold)); transition: background .3s; }
  .timer-fill.warn { background: linear-gradient(90deg, var(--gold), var(--rose)); }
  .timer-num { font-family: var(--display); font-size: 2.4vmin; min-width: 3.2vmin; text-align: right; }

  /* лобби */
  .lobby { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 4vmin; height: 100%; align-items: center; }
  .code { font-family: var(--display); font-size: 12.5vmin; line-height: .95; letter-spacing: .04em; white-space: nowrap;
          background: linear-gradient(135deg, var(--gold), var(--rose) 60%, var(--violet));
          -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { font-size: 2.5vmin; line-height: 1.45; }
  .url { font-family: var(--display); font-size: 3.1vmin; color: var(--gold); word-break: break-all; }
  .qr { background: #fff; padding: 1.6vmin; border-radius: 1.6vmin; width: 30vmin; height: 30vmin; display: grid; place-items: center; box-shadow: var(--shadow); }
  .qr svg { width: 100%; height: 100%; display: block; }
  .seats { display: flex; flex-wrap: wrap; gap: 1.4vmin; margin-top: 1vmin; }
  .seat { display: flex; align-items: center; gap: .9vmin; padding: 1vmin 1.8vmin; border-radius: 10vmin;
          font-weight: 700; font-size: 2vmin; background: var(--card); border: 1px solid var(--line); }
  .seat .em { font-size: 2.6vmin; }
  .seat.off { opacity: .35; }
  .seat.host::after { content: '★'; color: var(--gold); }
  .hint { font-size: 1.9vmin; color: var(--dim); }

  /* фаза письма */
  .writing { display: flex; flex-direction: column; justify-content: center; gap: 4vmin; height: 100%; text-align: center; }
  .big { font-family: var(--display); font-size: 7vmin; line-height: 1.05; }
  .prog { display: flex; flex-wrap: wrap; gap: 1.6vmin; justify-content: center; }
  .pcard { width: 20vmin; padding: 2vmin 1vmin; border-radius: 1.4vmin; background: var(--card); border: 2px solid var(--line); }
  .pcard.done { border-color: var(--mint); background: rgba(46,196,182,.14); }
  .pcard .em { font-size: 5vmin; line-height: 1; }
  .pcard .nm { font-weight: 800; font-size: 1.8vmin; margin-top: .6vmin; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcard .st { font-size: 1.5vmin; color: var(--dim); margin-top: .4vmin; }

  /* голосование */
  .vote { display: flex; flex-direction: column; height: 100%; gap: 3vmin; }
  .prompt { font-family: var(--display); font-size: 5.2vmin; line-height: 1.12; text-align: center; padding: 0 2vmin; }
  .duel { flex: 1 1 auto; display: grid; grid-template-columns: 1fr auto 1fr; gap: 2.4vmin; align-items: stretch; min-height: 0; }
  .ans { display: flex; flex-direction: column; justify-content: center; gap: 1.6vmin; padding: 3.4vmin 3vmin; border-radius: 2vmin;
         border: 3px solid var(--line); background: var(--card); text-align: center; }
  .ans .txt { font-size: 4vmin; font-weight: 800; line-height: 1.2; }
  .ans .who { font-size: 2vmin; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
  .ans.a { border-color: rgba(255,46,99,.5); }
  .ans.b { border-color: rgba(90,125,255,.5); }
  .ans.win { border-color: var(--gold); background: rgba(255,210,63,.14); box-shadow: 0 0 0 .6vmin rgba(255,210,63,.12); }
  .ans .votes { display: flex; gap: .6vmin; justify-content: center; flex-wrap: wrap; }
  .dot { width: 1.6vmin; height: 1.6vmin; border-radius: 50%; background: var(--gold); }
  .pts { font-family: var(--display); font-size: 3.2vmin; color: var(--gold); }
  .vs { align-self: center; font-family: var(--display); font-size: 4vmin; color: var(--dim); }
  .grid { flex: 1 1 auto; display: grid; gap: 2vmin; min-height: 0;
          grid-template-columns: repeat(auto-fit, minmax(26vmin, 1fr)); align-content: center; }
  .grid .ans { padding: 2.4vmin 2vmin; }
  .grid .ans .txt { font-size: 2.9vmin; }
  .grid .ans .pts { font-size: 2.6vmin; }
  .tally { text-align: center; font-size: 2vmin; color: var(--dim); }
  .quip { text-align: center; font-size: 2.6vmin; font-style: italic; color: var(--gold); min-height: 3.4vmin; padding: 0 6vmin; }
  .shout { font-family: var(--display); font-size: 4vmin; color: var(--rose); text-align: center; animation: shake .5s; }

  /* табло */
  .board { display: flex; flex-direction: column; justify-content: center; gap: 1.4vmin; height: 100%; max-width: 76vmin; margin: 0 auto; width: 100%; }
  .row { display: grid; grid-template-columns: 4vmin 1fr auto auto; align-items: center; gap: 2vmin;
         padding: 1.6vmin 2.4vmin; border-radius: 1.4vmin; background: var(--card); border: 1px solid var(--line); }
  .row .pos { font-family: var(--display); font-size: 2.6vmin; color: var(--dim); }
  .row .nm { font-weight: 800; font-size: 2.8vmin; display: flex; align-items: center; gap: 1.2vmin; }
  .row .gain { font-size: 2.2vmin; color: var(--mint); font-weight: 800; }
  .row .sc { font-family: var(--display); font-size: 3.2vmin; min-width: 9vmin; text-align: right; }
  .row.lead { background: linear-gradient(90deg, rgba(255,210,63,.18), rgba(255,255,255,.05)); border-color: rgba(255,210,63,.45); }

  /* победитель */
  .win { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vmin; height: 100%; text-align: center; }
  .win .em { font-size: 18vmin; line-height: 1; }
  .win .nm { font-family: var(--display); font-size: 9vmin;
             background: linear-gradient(135deg, var(--gold), var(--rose)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .win .sc { font-family: var(--display); font-size: 4vmin; color: var(--gold); }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4vmin; height: 100%; text-align: center; }
  .spinner { width: 9vmin; height: 9vmin; border-radius: 50%; border: .9vmin solid rgba(255,255,255,.14); border-top-color: var(--gold); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .mutehint { position: fixed; bottom: 1.6vmin; right: 2vmin; font-size: 1.5vmin; color: var(--dim); z-index: 6; }
  .badge { display: inline-block; padding: .5vmin 1.4vmin; border-radius: 6vmin; background: rgba(255,210,63,.16); color: var(--gold); font-size: 1.5vmin; font-weight: 800; }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="stage">
  <div class="top">
    <div class="brand">БАЛА<span>ГАН</span></div>
    <div class="roundtag caps dim" id="roundtag"></div>
    <div style="display:flex;align-items:center;gap:1.4vmin;min-width:16vmin;justify-content:flex-end">
      <div class="timer" id="timer" style="width:12vmin;display:none"><div class="timer-fill" id="tfill"></div></div>
      <div class="timer-num" id="tnum"></div>
    </div>
  </div>
  <div class="body" id="app"></div>
</div>
<div class="mutehint" id="mutehint" style="display:none">клик по экрану — включить звук</div>

<script type="module">
const app = document.getElementById('app');
const roundtag = document.getElementById('roundtag');
const timerBar = document.getElementById('timer');
const tfill = document.getElementById('tfill');
const tnum = document.getElementById('tnum');

let S = null;          // последнее состояние
let key = '';          // ключ перерисовки
let joinUrl = '';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const byId = (id) => (S?.players || []).find((p) => p.id === id);

/* ---------- связь ---------- */
let ws, retry = 0;
const askedCode = new URLSearchParams(location.search).get('code')?.toUpperCase();
const saved = askedCode || sessionStorage.getItem('balagan.tv.code');

function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.onopen = () => { retry = 0; ws.send(JSON.stringify({ t: 'tv', code: saved || undefined, game: 'shutka' })); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === 'welcome') { joinUrl = m.joinUrl; sessionStorage.setItem('balagan.tv.code', m.code); return; }
    if (m.t === 'error') { sessionStorage.removeItem('balagan.tv.code'); location.reload(); return; }
    if (m.t === 'sound') return sfx(m.name);
    if (m.t === 'state') { S = m; render(); }
  };
  ws.onclose = () => { retry++; setTimeout(connect, Math.min(400 * retry, 4000)); };
}
connect();

/* ---------- таймер ---------- */
function tick() {
  if (S?.deadline) {
    const left = Math.max(0, S.deadline - Date.now());
    const total = S.phase === 'writing' ? 80000 : S.phase === 'voting' ? 20000 : 8000;
    timerBar.style.display = '';
    tfill.style.width = `${Math.min(100, (left / total) * 100)}%`;
    tfill.classList.toggle('warn', left < 8000);
    tnum.textContent = Math.ceil(left / 1000);
  } else {
    timerBar.style.display = 'none';
    tnum.textContent = '';
  }
  requestAnimationFrame(tick);
}
tick();

/* ---------- отрисовка ---------- */
function render() {
  const s = S;
  roundtag.textContent = s.round
    ? (s.round >= s.totalRounds ? 'ФИНАЛ · ТРОЙНЫЕ ОЧКИ' : `РАУНД ${s.round} ИЗ ${s.totalRounds}`)
    : (s.gameTitle || '');

  const k = [s.phase, s.round, s.matchNo, s.players.length, s.players.map((p) => p.connected ? 1 : 0).join('')].join('|');
  if (k !== key) { key = k; draw(); } else { live(); }
}

function draw() {
  const s = S;
  if (s.phase === 'lobby') return drawLobby();
  if (s.phase === 'cooking') return drawCooking();
  if (s.phase === 'writing') return drawWriting();
  if (s.phase === 'voting') return drawVoting();
  if (s.phase === 'reveal') return drawReveal();
  if (s.phase === 'scores') return drawBoard(false);
  if (s.phase === 'winner') { drawWinner(); confetti(); return; }
  app.innerHTML = '';
}

function live() {
  const s = S;
  if (s.phase === 'writing') {
    for (const w of s.wrote || []) {
      const el = app.querySelector(`[data-p="${w.id}"]`);
      if (!el) continue;
      const need = w.need || 2;
      el.classList.toggle('done', w.done >= need);
      el.querySelector('.st').textContent = w.done >= need ? 'готово' : `${w.done} из ${need}`;
    }
  }
  if (s.phase === 'voting') {
    const t = app.querySelector('.tally');
    if (t) t.textContent = `проголосовали ${s.voted} из ${s.voters}`;
  }
  if (s.phase === 'reveal') {
    const q = app.querySelector('.quip');
    if (q && s.quip && q.textContent !== s.quip) { q.textContent = s.quip; q.classList.add('rise'); }
  }
}

function drawLobby() {
  const s = S;
  const seats = s.players.map((p) => `
    <div class="seat ${p.connected ? '' : 'off'} ${p.isHost ? 'host' : ''}" style="border-color:${p.color}55">
      <span class="em">${p.emoji}</span>${esc(p.name)}
    </div>`).join('');
  const need = Math.max(0, (s.minPlayers || 3) - (s.writers?.length || 0));
  app.innerHTML = `
    <div class="lobby rise">
      <div>
        <div class="caps dim" style="font-size:1.8vmin">заходите с телефона</div>
        <div class="url">${esc(joinUrl.replace(/^https?:\/\//, ''))}</div>
        <div class="lead" style="margin-top:2.6vmin">код комнаты</div>
        <div class="code">${s.code.split('').join(' ')}</div>
        <div class="hint">${need
          ? `нужно ещё ${need} ${need === 1 ? 'игрок' : 'игрока'} — всего от 3 до 10, остальные идут в зал и голосуют`
          : 'все на месте — тот, у кого ★, жмёт «Начать» на телефоне'}</div>
        ${s.aiNote ? `<div class="badge" style="margin-top:1.6vmin">${esc(s.aiNote)}</div>` : ''}
        <div class="seats">${seats || '<span class="hint">пока никого…</span>'}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:2vmin">
        <div class="qr" id="qr"></div>
        <div class="hint">наведи камеру</div>
      </div>
    </div>`;
  if (joinUrl) fetch(`/qr?d=${encodeURIComponent(joinUrl)}`).then((r) => r.text()).then((svg) => {
    const box = document.getElementById('qr'); if (box) box.innerHTML = svg;
  }).catch(() => {});
}

function drawCooking() {
  app.innerHTML = `
    <div class="center rise">
      <div class="spinner"></div>
      <div class="big">Придумываем задания<br>под вашу компанию</div>
      ${S.topic ? `<div class="lead dim">тема: «${esc(S.topic)}»</div>` : ''}
    </div>`;
}

function drawWriting() {
  const s = S;
  const cards = (s.wrote || []).map((w) => {
    const p = byId(w.id) || {};
    const need = w.need || 2;
    return `<div class="pcard ${w.done >= need ? 'done' : ''}" data-p="${w.id}">
      <div class="em">${p.emoji || '🙂'}</div>
      <div class="nm" style="color:${p.color || '#fff'}">${esc(p.name)}</div>
      <div class="st">${w.done >= need ? 'готово' : `${w.done} из ${need}`}</div>
    </div>`;
  }).join('');
  app.innerHTML = `
    <div class="writing rise">
      <div>
        <div class="caps dim" style="font-size:1.9vmin">${s.round >= s.totalRounds ? 'финальная затравка' : `каждому две затравки · по ${s.roundValue} очков`}</div>
        <div class="big" style="margin-top:1.4vmin">Пишите шутки<br>в телефоне</div>
      </div>
      <div class="prog">${cards}</div>
      ${s.audienceCount ? `<div class="hint">в зале ${s.audienceCount} — они будут голосовать</div>` : ''}
    </div>`;
}

function drawVoting() {
  const s = S;
  const opts = s.options || [];
  const duel = opts.length === 2;
  const cards = opts.map((o, i) => `
    <div class="ans ${i % 2 ? 'b' : 'a'}"><div class="txt">${esc(o?.text || '— промолчал —')}</div></div>`);
  app.innerHTML = `
    <div class="vote rise">
      <div class="caps dim" style="text-align:center;font-size:1.8vmin">${
        s.final ? 'финал · голосуют все, кроме себя' : `${s.matchNo} из ${s.matchTotal} · голосуйте в телефоне`}</div>
      <div class="prompt"${s.final ? ' style="font-size:4.2vmin"' : ''}>${esc(s.prompt)}</div>
      ${duel
        ? `<div class="duel">${cards[0]}<div class="vs">или</div>${cards[1]}</div>`
        : `<div class="grid">${cards.join('')}</div>`}
      <div class="tally">проголосовали ${s.voted} из ${s.voters}</div>
    </div>`;
}

function drawReveal() {
  const s = S;
  const rows = s.result?.rows || [];
  const duel = rows.length === 2;
  const cards = rows.map((r, i) => `
    <div class="ans ${i === 0 ? 'a win' : 'b'}">
      <div class="txt">${esc(r.text || '— промолчал —')}</div>
      <div class="votes">${Array.from({ length: r.votes }, () => '<span class="dot"></span>').join('')}</div>
      <div class="who" style="color:${r.color}">${r.emoji} ${esc(r.name)}</div>
      <div class="pts">+${r.pts}</div>
    </div>`);
  app.innerHTML = `
    <div class="vote rise">
      <div class="prompt" style="font-size:3.6vmin">${esc(s.prompt)}</div>
      ${s.result?.shutout ? '<div class="shout">ШУТКА! все голоса одному</div>' : ''}
      ${duel
        ? `<div class="duel">${cards[0]}<div class="vs">—</div>${cards[1]}</div>`
        : `<div class="grid">${cards.join('')}</div>`}
      <div class="quip">${esc(s.quip || '')}</div>
    </div>`;
}

function drawBoard(final) {
  const s = S;
  const gains = Object.fromEntries((s.table || []).map((t) => [t.id, t.gained]));
  const list = s.players.filter((p) => (s.writers || []).includes(p.id)).sort((a, b) => b.score - a.score);
  app.innerHTML = `
    <div class="board rise">
      <div class="caps dim" style="text-align:center;font-size:1.9vmin;margin-bottom:1vmin">${final ? 'итог' : `после раунда ${s.round}`}</div>
      ${list.map((p, i) => `
        <div class="row ${i === 0 ? 'lead' : ''}">
          <div class="pos">${i + 1}</div>
          <div class="nm" style="color:${p.color}">${p.emoji} ${esc(p.name)}</div>
          <div class="gain">${gains[p.id] ? `+${gains[p.id]}` : ''}</div>
          <div class="sc">${p.score}</div>
        </div>`).join('')}
    </div>`;
}

function drawWinner() {
  const s = S;
  const list = s.players.filter((p) => (s.writers || []).includes(p.id)).sort((a, b) => b.score - a.score);
  const w = list[0];
  app.innerHTML = `
    <div class="win">
      <div class="caps dim" style="font-size:2vmin">самый смешной человек вечера</div>
      <div class="em pop">${w?.emoji || '🏆'}</div>
      <div class="nm pop">${esc(w?.name || '—')}</div>
      <div class="sc">${w?.score ?? 0} очков</div>
      <div class="hint" style="margin-top:2vmin">★ жмёт «Ещё раз» на телефоне</div>
    </div>`;
}

/* ---------- конфетти ---------- */
const cv = document.getElementById('confetti');
const ctx = cv.getContext('2d');
let bits = [];
function confetti() {
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ['#ff2e63', '#ffd23f', '#2ec4b6', '#5a7dff', '#c77dff'];
  bits = Array.from({ length: 160 }, () => ({
    x: Math.random() * cv.width, y: -Math.random() * cv.height,
    w: 6 + Math.random() * 8, h: 10 + Math.random() * 14,
    vy: 1.6 + Math.random() * 2.6, vx: -0.8 + Math.random() * 1.6,
    a: Math.random() * Math.PI, va: -0.1 + Math.random() * 0.2,
    c: colors[Math.floor(Math.random() * colors.length)],
  }));
  if (bits.length) loop();
}
function loop() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  let alive = false;
  for (const b of bits) {
    b.y += b.vy; b.x += b.vx; b.a += b.va;
    if (b.y < cv.height + 40) alive = true;
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a);
    ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore();
  }
  if (alive && S?.phase === 'winner') requestAnimationFrame(loop);
  else ctx.clearRect(0, 0, cv.width, cv.height);
}

/* ---------- звук (без файлов) ---------- */
let ac = null;
const hint = document.getElementById('mutehint');
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
  if (ac.state === 'suspended') { hint.style.display = ''; } else { hint.style.display = 'none'; }
  return ac;
}
addEventListener('pointerdown', () => { audio()?.resume(); hint.style.display = 'none'; }, { passive: true });
addEventListener('keydown', (e) => { if (e.key === 'f' || e.key === 'F') document.documentElement.requestFullscreen?.(); });

function tone(freq, dur, type = 'triangle', gain = 0.16, at = 0) {
  const a = audio(); if (!a || a.state !== 'running') return;
  const t = a.currentTime + at;
  const o = a.createOscillator(); const g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
const SFX = {
  join: () => { tone(660, .12, 'sine', .12); tone(990, .14, 'sine', .1, .08); },
  vote: () => tone(520, .07, 'square', .07),
  open: () => { tone(300, .14); tone(450, .18, 'triangle', .14, .09); },
  round: () => { [392, 523, 659].forEach((f, i) => tone(f, .22, 'triangle', .15, i * 0.1)); },
  reveal: () => { tone(587, .16); tone(880, .2, 'triangle', .14, .1); },
  shutout: () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, .26, 'sawtooth', .12, i * 0.07)); },
  scores: () => { tone(440, .12); tone(660, .16, 'sine', .12, .1); },
  win: () => { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, .35, 'triangle', .16, i * 0.12)); },
};
function sfx(name) { SFX[name]?.(); }
</script>
</body>
</html>
