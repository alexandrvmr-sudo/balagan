<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Балаган</title>
<link rel="stylesheet" href="/shared/base.css">
<link rel="stylesheet" href="/shared/tv.css">
</head>
<body data-game="menu">
<div class="backdrop" id="backdrop"><div class="art"></div></div>
<div class="shell">
  <div class="top">
    <div class="brand"><span class="bt">БАЛА<span>ГАН</span></span><span class="gname" id="gname"></span></div>
    <div class="tag" id="tag"></div>
    <div class="corner">
      <div class="roomchip" id="room"></div>
      <div id="ring"></div>
      <button class="mute" id="mute" title="звук">🔊</button>
    </div>
  </div>
  <div class="app" id="app"></div>
</div>
<div class="splash" id="splash">
  <div class="inner">
    <div class="logo"><i>Б</i><i>А</i><i>Л</i><i>А</i><i>Г</i><i>А</i><i>Н</i></div>
    <div class="go">Нажми, чтобы начать шоу</div>
    <div class="hint">F — полный экран · M — звук</div>
  </div>
</div>
<script type="module" src="/shared/tv.js"></script>
</body>
</html>
